# Kivra Voltage profile — PC target (≥2B, Int4/Int8 GGUF for consumer GPU)
# Base: Qwen2.5-3B (Apache 2.0). Alternative: Qwen3-4B → name it kivra-voltage-4b, never 2B.
profile: voltage
model:
  base_model: "Qwen/Qwen2.5-3B-Base"
  revision: null
  trust_remote_code: false
quantization:
  load_in_4bit: false        # set true on ≤16 GB VRAM; 3B fp16 ≈ 6 GB + activations
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"
train:
  seed: 42
  output_dir: "runs/kivra-voltage"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  max_steps: -1
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 200
  save_total_limit: 2
  max_seq_length: 2048
  packing: false
  fp16: false
  bf16: true                  # use bf16 on Ampere+ GPUs
  gradient_checkpointing: true
  dataloader_num_workers: 0
  report_to: []
